/* ---------- استكشف 4-1  معنى الضرب: أبراج المكعبات المتداخلة (3D) ---------- */
LABS.groups3d = api => {
  const lab = labIntro(api, 'أبراج المكعبات المتداخلة', 'كوّن مجموعات متساوية من المكعبات المتداخلة، ودوّر المجسّم لتعدّها. ثم جرّب أن **توزّع 20 مكعبًا** في مجموعات متساوية بطرائق مختلفة، وسجّل كل طريقة في الجدول.', ['5 مجموعات × 4', 'وزّع 20 على 3 مجموعات', '6 مجموعات × 4']);
  const ch = challenge(api, [
    { id: 'b54', t: 'نشاط الكتاب: كوّن **5 مجموعات** في كل منها **4 مكعبات**، وأوجد عدد المكعبات.' },
    { id: 'two', t: 'وزّع **20 مكعبًا** بطريقتين أخريين، وسجّلهما في الجدول.' },
    { id: 'b64', t: 'أتأكد: **6 مجموعات** في كل منها **4 مكعبات**.' }
  ]);
  let mode = 'b', g = 5, per = 4;
  const ways = new Map();
  const v = api.view3d({ yaw: -0.5, pitch: 0.42, height: 360, aspect: 0.72, aria: 'أبراج من المكعبات المتداخلة', hint: 'اسحب لتدوير الأبراج ↔' });
  const readout = h('div', { class: 'readout' }), say = sayBox(), table = h('table', { class: 'mtable' });
  const sG = stepper({ value: g, min: 1, max: 10, label: 'عدد المجموعات', onChange: x => { g = x; build(); } });
  const sP = stepper({ value: per, min: 1, max: 10, label: 'المكعبات في كل مجموعة', onChange: x => { per = x; build(); } });
  const sgM = seg([{ v: 'b', t: 'أكوّن مجموعات' }, { v: 'd', t: 'أوزّع ٢٠ مكعبًا' }], mode, x => { mode = x; sP.hidden = mode === 'd'; ask.hidden = mode === 'd'; rec.hidden = mode !== 'd'; build(); }, 'التجربة');
  const ask = askBox({ q: 'كم مكعبًا في المجموعات كلها؟', ans: () => g * per, ok: x => `صحيح: ${Array(g).fill(per).join(' + ')} = ${x}، أي ${g} × ${per} = ${x}.`, bad: 'عدّ المكعبات، أو اجمع عدد كل مجموعة مرات متكررة.', onRight: () => { if (g === 5 && per === 4) ch.mark('b54'); if (g === 6 && per === 4) ch.mark('b64'); } });
  const rec = btn('سجّل هذه الطريقة في الجدول', () => {
    const p = Math.floor(20 / g), r = 20 % g;
    if (r) { say.set(`لا يمكن تسجيلها: لم تتساوَ المجموعات، وبقي ${r} ${r === 1 ? 'مكعب' : r <= 10 ? 'مكعبات' : 'مكعبًا'}.`, 'bad'); return; }
    if (!ways.has(g)) { ways.set(g, p); drawTable(); }
    say.set(`سجّلت: ${g} × ${p} = 20.`, 'ok');
    if ([...ways.keys()].filter(k => !(k === 5)).length >= 2) ch.mark('two');
  }, 'sm primary');
  rec.hidden = true;
  function drawTable() {
    clear(table).append(h('thead', null, h('tr', null, h('th', null, 'عدد المجموعات'), h('th', null, 'في كل مجموعة'), h('th', null, 'المجموع'))),
      h('tbody', null, [...ways.entries()].sort((a, b) => a[0] - b[0]).map(([k, p]) => h('tr', null, h('td', null, ar(k)), h('td', null, ar(p)), h('td', null, ar(20))))));
  }
  function build() {
    const p = mode === 'd' ? Math.floor(20 / g) : per, left = mode === 'd' ? 20 % g : 0;
    v.voxels = [];
    for (let t = 0; t < g; t++) for (let j = 0; j < p; j++) v.voxels.push({ i: (g - 1 - t) * 2, j, k: 0, color: t % 2 ? '--tens' : '--thou', stud: true, g: t });
    for (let q = 0; q < left; q++) v.voxels.push({ i: -3 - (q % 2), j: Math.floor(q / 2), k: 0, color: '--line-2', stud: true, g: 99 });
    v.fit(null, true); v.render();
    const sent = `${g} × ${p} = ${g * p}`;
    clear(readout).append(kv('الجمع المتكرر', ar(Array(g).fill(p).join(' + ') + ' = ' + g * p)), kv('جملة الضرب', ar(sent)));
    if (mode === 'd') say.set(left ? `وزّعت 20 على ${g} مجموعات: في كل مجموعة ${p}، وبقي ${left} (الرمادية)؛ المجموعات ليست متساوية بكل المكعبات.` : `20 مكعبًا = ${g} مجموعات متساوية في كل منها ${p}.`, left ? 'bad' : 'ok');
    else { say.set(''); ask.reset(); }
  }
  drawTable(); build();
  lab.append(h('div', { class: 'controls' }, sgM, sG, sP), v.el, readout, say, ask, rec, h('div', { class: 'scrollx' }, table), ch.el);
};

/* ---------- 4-1  الشبكات ---------- */

  const lab = labIntro(api, 'صانع الشبكات', 'اسحب المقبض الدائري في زاوية الشبكة لتغيّر عدد الصفوف والأعمدة، أو استعمل الأزرار. اضغط «دوّر الشبكة» لترى **خاصية الإبدال**: يتغيّر ترتيب العاملين ولا يتغيّر ناتج الضرب.', ['أكواب ليلى 3 × 5', 'ألبوم سعاد 4 × 2', 'شبكتان للعدد 12']);
  const ch = challenge(api, [
    { id: 'cups', t: 'أكواب ليلى: كوّن شبكة من **3 صفوف** في كل صف **5 أكواب**، وأوجد عددها.' },
    { id: 'rot', t: 'ألبوم سعاد: كوّن الشبكة **4 × 2** ثم دوّرها.' },
    { id: 'twelve', t: 'كوّن **شبكتين مختلفتين** فيهما 12 قطعة.' }

  const say = sayBox(), readout = h('div', { class: 'readout' });
  const AG = new ArrayGrid({ rows: 2, cols: 3, maxR: 8, maxC: 9, icon: 'square', color: '--u4', aria: 'شبكة من صفوف وأعمدة', onChange: (r, c) => changed(r, c) });
  AG.svg.setAttribute('style', 'max-width:520px;touch-action:none;user-select:none');
  const sR = stepper({ value: 2, min: 1, max: 8, label: 'الصفوف', onChange: x => AG.set(x, AG.c) });
  const sC = stepper({ value: 3, min: 1, max: 9, label: 'في كل صف', onChange: x => AG.set(AG.r, x) });
  const ask = askBox({ q: 'كم قطعة في الشبكة؟', ans: () => AG.r * AG.c, ok: x => `صحيح: ${AG.r} × ${AG.c} = ${x}.`, bad: () => `اجمع عدد كل صف ${AG.r} مرات: ${Array(AG.r).fill(AG.c).join(' + ')}`, onRight: () => { if (AG.r === 3 && AG.c === 5) ch.mark('cups'); } });

  }

    const r = AG.r, c = AG.c;

  const scen = h('div', { class: 'chips' }, h('span', { class: 'tiny muted' }, 'مواقف:'), [['أكواب ليلى', 3, 5], ['ألبوم سعاد', 4, 2], ['أعلام ٥ أطفال', 5, 2]].map(([t, r, c]) => h('button', { type: 'button', class: 'chipbtn', onclick: () => { AG.set(r, c); say.set(t === 'ألبوم سعاد' ? 'الصفحة الأولى: 4 صفوف في كل صف صورتان. دوّرها لتصير الصفحة الأخرى: صفان في كل صف 4 صور.' : t === 'أعلام ٥ أطفال' ? 'خمسة أطفال، كل طفل يحمل علمين: 5 × 2، وأيضًا 2 × 5.' : 'رتّبت ليلى الأكواب في 3 صفوف، في كل صف 5 أكواب.'); } }, t)));
  changed(2, 3);

/* ---------- 5-7  الخاصية التجميعية: منشور من المكعبات (3D) ---------- */
LABS.assoc3d = api => {
  const lab = labIntro(api, 'منشور التجميع', 'كوّن مجسّمًا من **أ × ب × ج** مكعبًا، ثم اختر مكان القوسين: يتفكّك المجسّم إلى طبقات أو شرائح، ويبقى عدد المكعبات نفسه. بدّل العوامل بالزر ⇄ لتختار الأسهل.', ['2 × 3 × 4', 'قصص حامد 3 × 2 × 6', '2 × 5 × ■ = 30']);
  const ch = challenge(api, [
    { id: 'both', t: 'كوّن **2 × 3 × 4** وجرّب التجميعين: (2 × 3) × 4 و2 × (3 × 4).' },
    { id: 'hamed', t: 'قصص حامد: رتّب العوامل 3 و2 و6 لتبدأ بـ **(3 × 2)**، ثم أوجد عدد الصور.' },
    { id: 'noura', t: '**2 × 5 × ■ = 30**: ما العامل المجهول؟' }
  ]);
  let F = [2, 3, 4], grp = null; const tried = new Set();
  const v = api.view3d({ yaw: -0.62, pitch: 0.5, height: 380, aspect: 0.8, aria: 'منشور من المكعبات', hint: 'اسحب لتدوير المجسّم ↔' });
  const fRow = h('div', { class: 'frow' }), eq = h('p', { class: 'eqtext' }), say = sayBox();
  const COL = ['--u5', '--hund', '--tens', '--ones', '--thou', '--tthou'];
  function build(anim) {
    const [a, b, c] = F; /* a → across, b → depth, c → height */
    const target = [];
    for (let i = 0; i < a; i++) for (let k = 0; k < b; k++) for (let j = 0; j < c; j++) {
      const layer = grp === 'L' ? j : grp === 'R' ? i : 0;
      target.push({ i, j, k, color: grp === 'L' ? COL[j % 6] : grp === 'R' ? COL[i % 6] : '--u5', g: grp ? layer : 0, tdx: grp === 'R' ? i * 0.9 : 0, tdy: grp === 'L' ? j * 0.9 : 0 });
    }
    const from = new Map(v.voxels.map(q => [q.i + ',' + q.j + ',' + q.k, q]));
    v.voxels = target.map(t => { const o = from.get(t.i + ',' + t.j + ',' + t.k); return Object.assign(t, { dx: o ? o.dx || 0 : 0, dy: o ? o.dy || 0 : 0 }); });
    const ext = { x0: 0, y0: 0, z0: 0, x1: a + (grp === 'R' ? (a - 1) * 0.9 : 0), y1: c + (grp === 'L' ? (c - 1) * 0.9 : 0), z1: b };
    v.fit(ext, true);
    if (anim && !RM) { const st = v.voxels.map(q => [q.dx, q.dy]); tween(600, t => { v.voxels.forEach((q, n) => { q.dx = lerp(st[n][0], q.tdx, t); q.dy = lerp(st[n][1], q.tdy, t); }); v.render(); }, ease.back); }
    else { v.voxels.forEach(q => { q.dx = q.tdx; q.dy = q.tdy; }); v.render(); }
  }
  function drawRow() {
    clear(fRow);
    F.forEach((f, idx) => {
      if (idx) fRow.append(h('button', { type: 'button', class: 'swapb', 'aria-label': 'بدّل العاملين', onclick: () => { [F[idx - 1], F[idx]] = [F[idx], F[idx - 1]]; grp = null; refresh(true); } }, '⇄'));
      fRow.append(stepper({ value: f, min: 1, max: 6, label: ['العامل الأول', 'العامل الثاني', 'العامل الثالث'][idx], onChange: x => { F[idx] = x; grp = null; refresh(true); } }));
    });
  }
  function refresh(anim) {
    drawRow(); build(anim);
    const [a, b, c] = F, P = a * b * c;
    if (grp === 'L') eq.textContent = ar(`(${a} × ${b}) × ${c} = ${a * b} × ${c} = ${P}`);
    else if (grp === 'R') eq.textContent = ar(`${a} × (${b} × ${c}) = ${a} × ${b * c} = ${P}`);
    else eq.textContent = ar(`${a} × ${b} × ${c} = ${P}`);
  }
  function group(side) {
    grp = side; refresh(true);
    const [a, b, c] = F;
    say.set(side === 'L' ? `بدأت بـ (${a} × ${b}): ${c} ${c > 2 ? 'طبقات' : 'طبقة'}، في كل طبقة ${a * b} مكعبًا.` : `بدأت بـ (${b} × ${c}): ${a} ${a > 2 ? 'شرائح' : 'شريحة'}، في كل شريحة ${b * c} مكعبًا.`, 'ok');
    if ([2, 3, 4].every((x, i) => F[i] === x)) { tried.add(side); if (tried.size === 2) ch.mark('both'); }
    if (side === 'L' && ((a === 3 && b === 2) || (a === 2 && b === 3)) && c === 6) { say.set(`(${a} × ${b}) × 6 = 6 × 6 = 36 صورة؛ من الأسهل البدء بـ ${a} × ${b}.`, 'ok'); ch.mark('hamed'); }
  }
  const ask = askBox({ q: '2 × 5 × ■ = 30. ما العدد في المربع؟', ans: 3, ok: 'صحيح: 2 × 5 = 10، و10 × 3 = 30. جرّب أن تكوّن 2 × 5 × 3 لترى 30 مكعبًا.', bad: 'اضرب 2 × 5 أولًا (التجميع)، ثم: 10 × ■ = 30.', onRight: () => ch.mark('noura') });
  const scen = h('div', { class: 'chips' }, h('span', { class: 'tiny muted' }, 'جرّب:'), [[2, 3, 4], [3, 6, 2], [2, 5, 3]].map(x => h('button', { type: 'button', class: 'chipbtn', onclick: () => { F = x.slice(); grp = null; tried.clear(); refresh(true); say.set(''); } }, ar(x.join(' × ')))));
  refresh(false);
  lab.append(scen, fRow, v.el, eq,
    h('div', { class: 'row' }, btn('(الأوّلان) × الثالث', () => group('L'), 'sm primary'), btn('الأوّل × (الأخيران)', () => group('R'), 'sm primary'), btn('أعد المجسّم', () => { grp = null; refresh(true); say.set(''); }, 'sm ghost')),
    say, h('p', { class: 'bubble sm' }, ...rich('قرأ حامد **3 قصص**، كل منها تحتوي على **6 صفحات**، وفي كل صفحة **صورتان**. كم صورة في القصص؟')), ask, ch.el);
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
